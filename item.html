<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk QR Code Sheet // TagVault Baraton</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0a0a0c; color: #f3f4f6; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(18, 19, 24, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(245, 158, 11, 0.2); }
    </style>
</head>
<body class="p-8">

    <div class="max-w-7xl mx-auto">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-extrabold text-amber-400 mb-2"><i class="fa-solid fa-qrcode mr-3"></i>TagVault Batch QR Sheet (50 Students)</h1>
            <p class="text-slate-400 text-sm">University of Eastern Africa, Baraton — ISC Hackathon 2026 Test Suite</p>
            <button onclick="window.print()" class="mt-4 px-6 py-2.5 bg-amber-500 text-black font-bold rounded-xl hover:bg-amber-400 transition text-sm">
                <i class="fa-solid fa-print mr-2"></i> Print / Save as PDF Sheet
            </button>
        </div>

        <!-- Grid Container where all 50 QR codes will be injected -->
        <div id="qr-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- QR cards injected via JavaScript -->
        </div>
    </div>

    <script>
        // Array of your 50 student emails and sample items
        const students = [
            { email: "skibon2711@ueab.ac.ke", item: "Dorm Keys" },
            { email: "srotic2711@ueab.ac.ke", item: "Laptop" },
            { email: "schepn2711@ueab.ac.ke", item: "Student ID Card" },
            { email: "skembo2711@ueab.ac.ke", item: "Scientific Calculator" },
            { email: "smugok2711@ueab.ac.ke", item: "Power Bank" },
            { email: "skorir2711@ueab.ac.ke", item: "Earphones" },
            { email: "skplag2711@ueab.ac.ke", item: "Flash Disk" },
            { email: "scheru2711@ueab.ac.ke", item: "Notebook" },
            { email: "stowet2711@ueab.ac.ke", item: "Tumbler" },
            { email: "sbiwot2711@ueab.ac.ke", item: "Room Keys" },
            { email: "skinyu2711@ueab.ac.ke", item: "Library Book" },
            { email: "smaina2711@ueab.ac.ke", item: "Wallet" },
            { email: "smwand2711@ueab.ac.ke", item: "Phone Charger" },
            { email: "sotien2711@ueab.ac.ke", item: "AirPods" },
            { email: "sawino2711@ueab.ac.ke", item: "Jacket" },
            { email: "somond2711@ueab.ac.ke", item: "Backpack" },
            { email: "sakiny2711@ueab.ac.ke", item: "Calculator" },
            { email: "sanyan2711@ueab.ac.ke", item: "Water Bottle" },
            { email: "smutua2711@ueab.ac.ke", item: "Lab Coat" },
            { email: "smusyo2711@ueab.ac.ke", item: "Extension Cord" },
            { email: "skalon2711@ueab.ac.ke", item: "Flash Drive" },
            { email: "smulwa2711@ueab.ac.ke", item: "Dorm Keys" },
            { email: "swambu2711@ueab.ac.ke", item: "Headphones" },
            { email: "smwangi2711@ueab.ac.ke", item: "Laptop Bag" },
            { email: "snjeri2711@ueab.ac.ke", item: "Tumbler" },
            { email: "skaran2711@ueab.ac.ke", item: "Notebook" },
            { email: "skamau2711@ueab.ac.ke", item: "Keys" },

            { email: "scherop2711@ueab.ac.ke", item: "Dorm Keys" },
            { email: "sjelag2711@ueab.ac.ke", item: "ID Card" },
            { email: "sjepko2711@ueab.ac.ke", item: "Laptop" },
            { email: "skibet2711@ueab.ac.ke", item: "Earphones" },
            { email: "skipko2711@ueab.ac.ke", item: "Calculator" },
            { email: "skipto2711@ueab.ac.ke", item: "Wallet" },
            { email: "skembo2711@ueab.ac.ke", item: "Keys" },
            { email: "sjegon2711@ueab.ac.ke", item: "Backpack" },
            { email: "slagan2711@ueab.ac.ke", item: "Tumbler" }
        ];

        const grid = document.getElementById('qr-grid');

        // Loop through each student and generate their card + QR code
        students.forEach((student, index) => {
            const studentId = student.email.split('@')[0];
            
            // Construct the exact target URL pointing to your item.html
            const targetUrl = `https://mugokm.github.io/baraton-digital--buildoff/item.html?email=${student.email}&item=${encodeURIComponent(student.item)}`;

            // Create card HTML
            const card = document.createElement('div');
            card.className = "glass-card p-5 rounded-2xl text-center flex flex-col items-center justify-between shadow-xl";
            card.innerHTML = `
                <div class="mb-3 w-full">
                    <span class="text-xs font-bold text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-full">Tag #${index + 1}</span>
                    <h3 class="text-sm font-extrabold text-white mt-2">${studentId}</h3>
                    <p class="text-xs text-slate-400">${student.item}</p>
                </div>
                <div id="qrcode-${index}" class="bg-white p-3 rounded-xl my-2 inline-block"></div>
                <p class="text-[10px] text-slate-500 truncate w-full mt-2">${student.email}</p>
            `;
            grid.appendChild(card);

            // Render QR Code inside the card
            new QRCode(document.getElementById(`qrcode-${index}`), {
                text: targetUrl,
                width: 128,
                height: 128,
                colorDark: "#0a0a0c",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        });
    </script>
</body>
</html>
