<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Verification // TagVault Baraton</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0a0a0c',
                        carddark: '#121318',
                        goldglow: '#f59e0b',
                        luxurygold: '#d97706',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body, a, button { cursor: none !important; }
        .cursor-dot, .cursor-outline {
            pointer-events: none;
            position: fixed;
            top: 0; left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
        .cursor-dot { width: 8px; height: 8px; background-color: #f59e0b; }
        .cursor-outline {
            width: 40px; height: 40px;
            border: 1px solid rgba(245, 158, 11, 0.5);
            transition: width 0.2s, height 0.2s, transform 0.1s;
        }
        body { background-color: #0a0a0c; color: #f3f4f6; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .glass-card { background: rgba(18, 19, 24, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 215, 0, 0.1); }
        .gold-gradient-text {
            background: linear-gradient(135deg, #fef3c7 0%, #f59e0b 50%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-obsidian text-slate-100 min-h-screen flex items-center justify-center p-6">

    <!-- Custom Cursor Tracker -->
    <div class="cursor-dot hidden md:block" data-cursor-dot></div>
    <div class="cursor-outline hidden md:block" data-cursor-outline></div>

    <div class="max-w-md w-full glass-card p-8 rounded-3xl border border-amber-500/20 shadow-2xl text-center">
        <!-- Shield Icon -->
        <div class="w-16 h-16 bg-amber-500/10 text-amber-400 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-6 border border-amber-500/20 shadow-lg shadow-amber-500/10">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        
        <h1 class="text-2xl font-extrabold mb-1">TagVault Ownership</h1>
        <p class="text-slate-400 text-xs uppercase tracking-wider mb-6">University of Eastern Africa, Baraton</p>

        <!-- Item & Owner Display Container -->
        <div class="bg-black/50 p-6 rounded-2xl text-left border border-white/5 space-y-4 text-sm mb-6">
            <div>
                <span class="block text-xs uppercase tracking-wider text-slate-500 mb-1">Item Category</span>
                <span id="display-item" class="text-base font-bold text-white flex items-center">
                    <i class="fa-solid fa-box text-amber-400 mr-2"></i> Campus Keys / Valuables
                </span>
            </div>

            <hr class="border-white/5 my-2">

            <div>
                <span class="block text-xs uppercase tracking-wider text-slate-500 mb-1">Student Owner ID</span>
                <span id="display-id" class="text-base font-bold text-amber-400">smugmo2711</span>
            </div>

            <hr class="border-white/5 my-2">

            <div>
                <span class="block text-xs uppercase tracking-wider text-slate-500 mb-1">Contact Email</span>
                <a id="display-email-link" href="mailto:smugmo2711@ueab.ac.ke" class="text-base font-bold text-amber-400 hover:underline break-all flex items-center">
                    <i class="fa-solid fa-envelope mr-2"></i> <span id="display-email">smugmo2711@ueab.ac.ke</span>
                </a>
            </div>
        </div>

        <!-- Direct Email Action Button -->
        <a id="action-email-btn" href="mailto:smugmo2711@ueab.ac.ke?subject=Found%20Your%20Lost%20Item%20(TagVault)" class="w-full py-4 bg-amber-500 text-black font-extrabold rounded-xl hover:bg-amber-400 transition shadow-lg shadow-amber-500/20 text-sm flex items-center justify-center">
            <i class="fa-solid fa-paper-plane mr-2"></i> Email Student Directly
        </a>
    </div>

    <script>
        // Parse parameters from QR URL if supplied (e.g. item.html?id=smugmo2711&item=Scientific%20Calculator)
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('id') || 'smugmo2711';
        const studentEmail = urlParams.get('email') || `${studentId}@ueab.ac.ke`;
        const itemName = urlParams.get('item');

        // Dynamically update fields
        document.getElementById('display-id').innerText = studentId;
        document.getElementById('display-email').innerText = studentEmail;
        document.getElementById('display-email-link').href = `mailto:${studentEmail}`;
        document.getElementById('action-email-btn').href = `mailto:${studentEmail}?subject=Found%20Your%20Lost%20Item%20(TagVault)`;

        if (itemName) {
            document.getElementById('display-item').innerHTML = `<i class="fa-solid fa-box text-amber-400 mr-2"></i> ${itemName}`;
        }

        // Custom Cursor Tracker Script
        const cursorDot = document.querySelector('[data-cursor-dot]');
        const cursorOutline = document.querySelector('[data-cursor-outline]');
        window.addEventListener('mousemove', (e) => {
            cursorDot.style.left = `${e.clientX}px`;
            cursorDot.style.top = `${e.clientY}px`;
            cursorOutline.animate({ left: `${e.clientX}px`, top: `${e.clientY}px` }, { duration: 400, fill: "forwards" });
        });
    </script>
</body>
</html>
