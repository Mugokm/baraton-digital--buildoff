<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claim 5-Tag Bundle (KSh 50) — TagVault UEAB</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --navy: #0C204C; --cream: #FFF5CB; --ivory: #FCFBF7;
      --gold: #C89D3C; --muted: #525B70; --border: rgba(12, 32, 76, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--ivory); color: #111827; font-family: 'Plus Jakarta Sans', sans-serif; padding: 36px 20px 120px; }
    @media (pointer: fine) { body, a, button, input { cursor: none; } }
    .cursor-dot, .cursor-ring { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; border-radius: 50%; transform: translate(-50%, -50%); }
    .cursor-dot { width: 7px; height: 7px; background: var(--gold); }
    .cursor-ring { width: 36px; height: 36px; border: 1.5px solid var(--navy); transition: width 0.2s, height 0.2s, background-color 0.2s; }
    .cursor-ring.is-hovering { width: 58px; height: 58px; background: rgba(12, 32, 76, 0.14); border-color: var(--gold); }
    @media (pointer: coarse) { .cursor-dot, .cursor-ring { display: none; } }
    .wrap { max-width: 820px; margin: 0 auto; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--navy); text-decoration: none; font-weight: 600; font-size: 14px; margin-bottom: 24px; }
    .card { background: #FFFFFF; border: 1px solid var(--border); border-radius: 24px; padding: 36px; box-shadow: 0 20px 45px rgba(12, 32, 76, 0.06); }
    h1 { font-family: 'Fraunces', serif; color: var(--navy); font-size: 2.2rem; margin-bottom: 8px; }
    .sub { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
    input { width: 100%; padding: 13px 15px; border-radius: 12px; border: 1px solid var(--border); font-size: 14.5px; background: var(--ivory); }
    input:focus { outline: none; border-color: var(--gold); background: #FFF; }
    .items-box { background: var(--cream); border: 1px solid rgba(200, 157, 60, 0.45); border-radius: 16px; padding: 20px; margin: 22px 0; }
    .item-row { display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 10px; margin-bottom: 10px; }
    .item-row:last-child { margin-bottom: 0; }
    .tag-num { width: 32px; height: 32px; border-radius: 8px; background: var(--navy); color: var(--cream); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
    .submit-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--navy); color: var(--cream); font-size: 16px; font-weight: 700; transition: transform 0.2s; }
    .submit-btn:hover { transform: translateY(-2px); }
    .generated-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 32px; }
    .qr-ticket { border: 1.5px dashed var(--navy); border-radius: 16px; padding: 18px; text-align: center; background: #FFF; }
    .qr-ticket img { width: 130px; height: 130px; margin: 10px auto; display: block; }
    .floating-dock-wrap { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 500; }
    .floating-dock { display: flex; gap: 4px; padding: 8px 12px; border-radius: 999px; background: rgba(12, 32, 76, 0.94); border: 1px solid rgba(230, 199, 117, 0.35); }
    .floating-dock a { color: var(--cream); text-decoration: none; font-size: 12.5px; padding: 8px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
    .floating-dock a.active { background: rgba(255, 245, 203, 0.16); color: #E6C775; }
    @media (max-width: 680px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>
  <div class="wrap">
    <a href="index.html" class="back-link" data-hover><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    <div class="card">
      <h1>Claim Your 5-Tag Student Pack</h1>
      <p class="sub">One-time <strong>KSh 50</strong> activation covers 5 hybrid QR/NFC stickers for <strong>4 academic years</strong> (renewable thereafter at KSh 100/year for extended storage).</p>
      <form id="claimForm">
        <div class="grid-2">
          <div><label>Student Full Name</label><input type="text" id="studentName" placeholder="e.g. Samuel Kibon" required data-hover /></div>
          <div><label>UEAB Student Email (Masked on Scan)</label><input type="email" id="studentEmail" placeholder="skibon2711@ueab.ac.ke" required data-hover /></div>
        </div>
        <div><label>M-Pesa Confirmation Code (KSh 50 Paybill / Till)</label><input type="text" id="mpesaRef" placeholder="e.g. TJK892LM10" required data-hover /></div>
        <div class="items-box">
          <label style="margin-bottom:12px;">Assign Your 5 Protected Campus Items:</label>
          <div class="item-row"><span class="tag-num">#1</span><input type="text" class="item-input" value="Dorm Keys" required /></div>
          <div class="item-row"><span class="tag-num">#2</span><input type="text" class="item-input" value="UEAB Student ID Card" required /></div>
          <div class="item-row"><span class="tag-num">#3</span><input type="text" class="item-input" value="HP Laptop & Charger" required /></div>
          <div class="item-row"><span class="tag-num">#4</span><input type="text" class="item-input" value="Scientific Calculator" required /></div>
          <div class="item-row"><span class="tag-num">#5</span><input type="text" class="item-input" value="Core Course Textbook" required /></div>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn" data-hover><i class="fa-solid fa-lock"></i> Activate 5-Tag Bundle (4-Year Coverage)</button>
      </form>
      <div id="resultArea" style="display:none;">
        <div style="margin-top:28px; padding:16px; border-radius:12px; background:#ECFDF5; color:#065F46; font-size:14px; font-weight:600;" id="statusBanner"></div>
        <div class="generated-grid" id="qrGrid"></div>
      </div>
    </div>
  </div>
  <div class="floating-dock-wrap">
    <nav class="floating-dock">
      <a href="index.html">Home</a>
      <a href="claim.html" class="active">Claim</a>
      <a href="explore.html">Explore</a>
      <a href="recovered.html">Recovered</a>
      <a href="item.html?tag=UEAB-8841&item=Dorm%20Keys&email=skibon2711@ueab.ac.ke">Scan</a>
      <a href="admin.html">Admin</a>
    </nav>
  </div>
  <script>
    const dot = document.getElementById('cursorDot'), ring = document.getElementById('cursorRing');
    let mx = 0, my = 0, rx = 0, ry = 0;
    window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; dot.style.left = mx+'px'; dot.style.top = my+'px'; });
    (function loop(){ rx += (mx-rx)*0.18; ry += (my-ry)*0.18; ring.style.left = rx+'px'; ring.style.top = ry+'px'; requestAnimationFrame(loop); })();
    document.querySelectorAll('[data-hover]').forEach(el => {
      el.addEventListener('mouseenter', () => ring.classList.add('is-hovering'));
      el.addEventListener('mouseleave', () => ring.classList.remove('is-hovering'));
    });
    document.getElementById('claimForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.textContent = "Minting 5 Encrypted Tag IDs...";
      const email = document.getElementById('studentEmail').value.trim();
      const items = Array.from(document.querySelectorAll('.item-input')).map(i => i.value.trim());

      const tags = items.map(item => {
        const code = "UEAB-" + Math.random().toString(36).substring(2, 8).toUpperCase();
        return {
          tag_code: code,
          item,
          scan_url: `https://mugokm.github.io/baraton-digital--buildoff/item.html?tag=${code}&email=${encodeURIComponent(email)}&item=${encodeURIComponent(item)}`
        };
      });

      document.getElementById('statusBanner').textContent = "Bundle generated successfully! Valid for 4 Years (Renewal: KSh 100/yr after Year 4).";
      document.getElementById('qrGrid').innerHTML = tags.map(t => `
        <div class="qr-ticket">
          <span style="font-size:11px; font-weight:700; color:#C89D3C;">${t.tag_code}</span>
          <strong style="display:block; color:#0C204C; font-size:15px; margin:4px 0;">${t.item}</strong>
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&color=0C204C&data=${encodeURIComponent(t.scan_url)}" alt="QR Code" />
          <a href="item.html?tag=${t.tag_code}&email=${encodeURIComponent(email)}&item=${encodeURIComponent(t.item)}" target="_blank" style="font-size:12px; color:#0C204C; font-weight:600; display:inline-block; margin-top:8px;">Test Scan Link &rarr;</a>
        </div>
      `).join('');
      document.getElementById('resultArea').style.display = 'block';
      btn.innerHTML = '<i class="fa-solid fa-check"></i> Bundle Activated';
    });
  </script>
</body>
</html>
